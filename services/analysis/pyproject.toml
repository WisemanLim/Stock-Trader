[project]
name = "analysis"
version = "0.1.0"
description = "stock-trader — 기술지표·시계열예측·스크리너 서비스 (F2)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pandas>=2.2",
  # torch 2.2.2 (the last Intel-macOS build) is compiled against NumPy 1.x and
  # breaks on NumPy 2 ("Numpy is not available") — cap it on that platform only.
  "numpy>=2.0 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "numpy>=1.26,<2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "ta>=0.11",
  "finance-datareader>=0.9",
  "yfinance>=0.2",
  "httpx>=0.27",
  # PyTorch dropped Intel-macOS (x86_64) wheels after 2.2.2 — pin it there so
  # native local dev works; Linux/Apple-Silicon keep modern torch.
  "torch>=2.2 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "torch==2.2.2 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "transformers>=4.40",
  # transformers 5.x targets torch>=2.4; keep the 4.x line where torch is 2.2.2.
  "transformers<5 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
