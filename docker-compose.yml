# stock-trader — 통합 인프라 + 서비스 (finance 도메인)
# `make up`    → infra only (postgres+pgvector, redis)
# `make build` → docker compose --profile app build

services:
  # ── 인프라 ─────────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB:       ${POSTGRES_DB:-stock_trader}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-stock_trader}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7.4-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]

  # ── Python 분석 서비스 ─────────────────────────────────────────────────────────
  analysis:
    profiles: ["app"]
    build: { context: services/analysis }
    env_file: [".env.${ENV:-local}"]
    ports: ["${ANALYSIS_PORT:-8001}:8001"]
    depends_on: [postgres, redis]

  rag:
    profiles: ["app"]
    build: { context: services/rag }
    env_file: [".env.${ENV:-local}"]
    ports: ["${RAG_PORT:-8002}:8002"]
    depends_on: [postgres, redis]

  ingest:
    profiles: ["app"]
    build: { context: services/ingest }
    env_file: [".env.${ENV:-local}"]
    ports: ["${INGEST_PORT:-8003}:8003"]
    depends_on: [postgres, redis]

  agents:
    profiles: ["app"]
    build: { context: services/agents }
    env_file: [".env.${ENV:-local}"]
    environment:
      ANALYSIS_URL: "${ANALYSIS_URL:-http://analysis:8001}"
      RAG_URL: "${RAG_URL:-http://rag:8002}"
      INGEST_URL: "${INGEST_URL:-http://ingest:8003}"
      RISK_ENGINE_URL: "${RISK_ENGINE_URL:-http://risk-engine:3001}"
      BFF_URL: "${BFF_URL:-http://bff:3002}"
    ports: ["${AGENTS_PORT:-8004}:8004"]
    depends_on: [postgres, redis, analysis, rag, ingest]

  # ── Rust 리스크/체결 엔진 (F4 Critical — 10ms) ─────────────────────────────────
  risk-engine:
    profiles: ["app"]
    build:
      context: .
      dockerfile: core/risk-engine/Dockerfile
    env_file: [".env.${ENV:-local}"]
    ports: ["${RISK_ENGINE_PORT:-3001}:${RISK_ENGINE_PORT:-3001}"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    volumes:
      - risk-engine-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/3001' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # ── 웹 대시보드 (F6.2) ──────────────────────────────────────────────────────────
  bff:
    profiles: ["app"]
    build:
      context: web
      dockerfile: apps/bff/Dockerfile
    env_file: [".env.${ENV:-local}"]
    environment:
      ANALYSIS_URL: "${ANALYSIS_URL:-http://analysis:8001}"
      RAG_URL: "${RAG_URL:-http://rag:8002}"
      INGEST_URL: "${INGEST_URL:-http://ingest:8003}"
      AGENTS_URL: "${AGENTS_URL:-http://agents:8004}"
      RISK_ENGINE_URL: "${RISK_ENGINE_URL:-http://risk-engine:3001}"
    ports: ["${BFF_PORT:-3002}:3002"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      risk-engine: { condition: service_healthy }

  dashboard:
    profiles: ["app"]
    build:
      context: web
      dockerfile: apps/dashboard/Dockerfile
    env_file: [".env.${ENV:-local}"]
    environment:
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      NEXT_PUBLIC_BFF_URL: "${NEXT_PUBLIC_BFF_URL:-http://localhost:3002}"
      NEXT_PUBLIC_RISK_ENGINE_URL: "${NEXT_PUBLIC_RISK_ENGINE_URL:-http://localhost:3001}"
    volumes:
      - dashboard-data:/app/apps/dashboard/data
    ports: ["${DASHBOARD_PORT:-3000}:3000"]
    depends_on: [bff]

  # ── Finance 도메인 확장 인프라 (스케일 시 profiles 로 활성화) ─────────────────────
  # kafka:
  #   image: apache/kafka:3.8-alpine
  #   profiles: ["kafka"]
  #   ports: ["9092:9092"]
  #
  # neo4j:
  #   image: neo4j:5-community
  #   profiles: ["graphrag"]
  #   ports: ["7474:7474", "7687:7687"]
  #   environment: { NEO4J_AUTH: neo4j/password }
  #
  # minio:
  #   image: minio/minio:latest
  #   profiles: ["storage"]
  #   command: server /data --console-address ":9001"
  #   ports: ["9000:9000", "9001:9001"]

volumes:
  pgdata:
  dashboard-data:
  risk-engine-data:
